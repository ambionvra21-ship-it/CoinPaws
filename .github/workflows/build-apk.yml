name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Clean and Recreate Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: Safe Native Manifest AdMob Injection
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const manifestPath = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          
          if (!fs.existsSync(manifestPath)) {
            console.error('ERROR: AndroidManifest.xml not found!');
            process.exit(1);
          }
          
          let content = fs.readFileSync(manifestPath, 'utf8');
          
          // Cleanly inject both required AdMob initialization nodes safely inside the native application scope
          const adMobMeta = '\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-6655685917040449~5170056805\"/>\n        <meta-data android:name=\"com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT\" android:value=\"true\"/>';
          
          content = content.replace('</application>', adMobMeta + '\n    </application>');
          fs.writeFileSync(manifestPath, content, 'utf8');
          console.log('Successfully injected native AdMob components!');
          "

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPaws-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
