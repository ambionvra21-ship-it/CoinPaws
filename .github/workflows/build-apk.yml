name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Clean and Recreate Android Platform
        run: |
          # Force remove any broken or partial pre-existing android directories
          rm -rf android
          
          # Initialize a brand-new, clean native platform structure
          npx cap add android

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: Inject AdMob App ID safely via Node
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const manifestPath = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          
          if (!fs.existsSync(manifestPath)) {
            console.error('ERROR: Android Manifest file not found at: ' + manifestPath);
            process.exit(1);
          }
          
          let content = fs.readFileSync(manifestPath, 'utf8');
          const metaData = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-6655685917040449~5170056805\"/>';
          
          if (!content.includes('com.google.android.gms.ads.APPLICATION_ID')) {
            content = content.replace('</application>', '    ' + metaData + '\n    </application>');
            fs.writeFileSync(manifestPath, content, 'utf8');
            console.log('Successfully injected AdMob App ID!');
          } else {
            console.log('AdMob App ID already present in Manifest.');
          }
          "

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPaws-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
