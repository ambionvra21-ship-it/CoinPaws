name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform & Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          ADMOB_METADATA='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6655685917040449~5170056805"/>'
          
          # Safely injects the AdMob meta-data block right before the closing </application> tag
          sed -i "s|<\/application>|    $ADMOB_METADATA\n    <\/application>|g" "$MANIFEST_PATH"
          
          echo "Successfully injected AdMob ID into Manifest:"
          cat "$MANIFEST_PATH" | grep "APPLICATION_ID"

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPaws-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
