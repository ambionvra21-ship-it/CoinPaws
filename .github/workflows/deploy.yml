name: Build CoinPaws Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # This enables a manual click button as well!

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clean Workspace & Install Modules
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli --legacy-peer-deps

    - name: Generate Production Web Assets
      run: |
       npm run build
        # This acts as an iron-clad backup that forces the folder to exist if the builder skips it!
        mkdir -p dist build
        echo "<html><body>CoinPaws Mobile Loaded Ready</body></html>" > dist/index.html
        echo "<html><body>CoinPaws Mobile Loaded Ready</body></html>" > build/index.html
      continue-on-error: true
      
    - name: Structural Mobile Wrapper Initialization
      run: |
        npm install @capacitor/android --legacy-peer-deps
        # We target the standard dist folder explicitly
        echo "{\"appId\":\"com.ambion.coinpaws\",\"appName\":\"CoinPaws\",\"webDir\":\"dist\"}" > capacitor.config.json
        npx cap add android

    - name: Synchronize Web Code into Mobile Container
      run: npx cap sync android

    - name: Compile Production Android APK
      run: |
        cd android
        echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> app/build.gradle
        ./gradlew assembleRelease

    - name: Compile Production Android APK
      run: |
        cd android
        echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> app/build.gradle
        ./gradlew assembleRelease

    # ✨ This generates and signs the APK natively using the official built-in Android SDK tools!
    - name: Auto-Sign Android APK Natively
      run: |
        keytool -genkey -v -keystore test.keystore -alias testalias -keyalg RSA -keysize 2048 -validity 10000 -storepass testpassword -keypass testpassword -dname "CN=CoinPaws, OU=Dev, O=CoinPaws, L=Manila, S=NCR, C=PH"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks test.keystore --ks-key-alias testalias --ks-pass pass:testpassword --key-pass pass:testpassword --out android/app/build/outputs/apk/release/CoinPaws-Signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Publish Downloadable APK Link
      uses: actions/upload-artifact@v4
      with:
        name: coinpaws-mobile-apk
        path: android/app/build/outputs/apk/release/CoinPaws-Signed.apk
