name: Build CoinPaws Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # This enables a manual click button as well!

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clean Workspace & Install Modules
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli --legacy-peer-deps

    - name: Generate Production Web Assets
      run: npm run build
      continue-on-error: true # Bypasses minor styling alerts so compilation doesn't freeze

    - name: Structural Mobile Wrapper Initialization
      run: |
        npx cap init CoinPaws com.ambion.coinpaws --web-dir=dist
        npm install @capacitor/android
        npx cap add android

    - name: Synchronize Web Code into Mobile Container
      run: npx cap sync android

    - name: Compile Production Android APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Publish Downloadable APK Link
      uses: actions/upload-artifact@v4
      with:
        name: coinpaws-mobile-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
