name: Build CoinPaws Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # This enables a manual click button as well!

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Clean Workspace & Install Modules
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli --legacy-peer-deps

    - name: Generate Production Web Assets
      run: npm run build
      continue-on-error: true # Bypasses minor styling alerts so compilation doesn't freeze

    - name: Structural Mobile Wrapper Initialization
      run: |
        npm install @capacitor/android --legacy-peer-deps
        npx cap add android

    - name: Synchronize Web Code into Mobile Container
      run: npx cap sync android

    - name: Compile Production Android APK
      run: |
        cd android
        echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> app/build.gradle
        ./gradlew assembleRelease

    - name: Auto-Sign Android APK
      id: sign_apk
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ""
        alias: testalias
        keyStorePassword: testpassword
        keyPassword: testpassword
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Publish Downloadable APK Link
      uses: actions/upload-artifact@v4
      with:
        name: coinpaws-mobile-apk
        path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
